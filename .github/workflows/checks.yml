name: Source checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-ref-policy:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate preview or release source
        run: python3 scripts/check-release-ref.py --ref "$GITHUB_REF" --sha "$GITHUB_SHA"

  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Match the image npm version
        run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - name: Verify Go dependencies
        run: go mod verify
      - name: Text and input boundary contrast
        run: python3 -m unittest discover -s scripts -p test_ui_contrast.py -v
      - name: Required check aggregation contract
        run: python3 -m unittest discover -s scripts -p test_required_jobs.py -v
      - name: Release channel and ancestry contract
        run: python3 -m unittest discover -s scripts -p test_release_ref.py -v
      - name: Immutable publication and alias ordering contract
        run: python3 -m unittest discover -s scripts -p test_publication_policy.py -v
      - name: Generated candidate source subset integrity
        run: python3 -m unittest discover -s scripts -p test_prepare_candidate.py -v
      - name: Candidate material identity and failure contract
        run: python3 -m unittest discover -s scripts -p test_stage_candidate.py -v
      - name: Publication material and approval preflight contract
        run: python3 -m unittest discover -s scripts -p test_publication_preflight.py -v
      - name: Protected publication plan and same-run artifact handoff
        run: python3 -m unittest discover -s scripts -p test_import_publication_plan.py -v
      - name: Source-backed development preview and advisory policy
        run: python3 -m unittest discover -s scripts -p test_preview_publication.py -v
      - name: Publication transfer ordering and failure contract
        run: python3 -m unittest discover -s scripts -p test_write_publication.py -v
      - name: Preserve vulnerability scan timeout evidence
        run: python3 -m unittest discover -s scripts -p test_check_vulnerabilities.py -v
      - name: Advisory collection preserves failed thresholds and tool errors
        run: python3 -m unittest discover -s scripts -p test_scan_candidate.py -v
      - name: Embedded app identity contract
        run: python3 -m unittest discover -s scripts -p test_build_web_identity.py -v
      - name: Source bundle collector safety checks
        run: python3 -m unittest discover -s scripts -p test_collect_debian_sources.py -v
      - name: Base source hash and image subset binding
        run: python3 -m unittest discover -s scripts -p test_base_source.py -v
      - name: Aports recipe source collector safety checks
        run: python3 -m unittest discover -s scripts -p test_collect_aports_sources.py -v
      - name: Aports upstream archive collector safety checks
        run: python3 -m unittest discover -s scripts -p test_collect_aports_archives.py -v
      - name: Native SDK input lock contract
        run: python3 -m unittest discover -s scripts -p test_native_sdk_lock.py -v
      - name: Pinned Tesseract source and build failure gates
        run: python3 -m unittest discover -s scripts -p test_tesseract_build.py -v
      - name: SANE SDK input lock contract
        run: python3 -m unittest discover -s scripts -p test_sane_sdk_lock.py -v
      - name: SANE helper source selection and build failure gates
        run: python3 -m unittest discover -s scripts -p test_sane_helper_build.py -v
      - name: Native secfixes comparison safety checks
        run: python3 -m unittest discover -s scripts -p test_native_secfixes.py -v
      - name: Native runtime identity and origin contract
        run: python3 -m unittest discover -s scripts -p test_native_runtime_lock.py -v
      - name: Offline native assembly safety checks
        run: python3 -m unittest discover -s scripts -p test_assemble_native.py -v
      - name: Native selected-origin SBOM safety checks
        run: python3 -m unittest discover -s scripts -p test_native_sbom.py -v
      - name: Onefile inventory input binding and output safety
        run: python3 -m unittest discover -s scripts -p test_onefile_sbom.py -v
      - name: Saved image configuration and layer identity contract
        run: python3 -m unittest discover -s scripts -p test_saved_image_sbom.py -v
      - name: Native bootstrap failure and network separation contract
        run: python3 -m unittest discover -s scripts -p test_native_bootstrap.py -v
      - name: Native runtime APK input lock contract
        run: python3 -m unittest discover -s scripts -p test_runtime_apk_lock.py -v
      - name: Locked APK acquisition safety checks
        run: python3 -m unittest discover -s scripts -p test_fetch_native_apks.py -v
      - name: Locked Tesseract source acquisition safety checks
        run: python3 -m unittest discover -s scripts -p test_fetch_tesseract_source.py -v
      - name: Locked external source acquisition safety checks
        run: python3 -m unittest discover -s scripts -p test_fetch_source_inputs.py -v
      - name: Locked source archive integrity and failure contract
        run: python3 -m unittest discover -s scripts -p test_pack_source_inputs.py -v
      - name: Native pipeline failure, isolation and cleanup contracts
        run: python3 -m unittest discover -s scripts -p test_build_native.py -v
      - name: Native APK preparation safety checks
        run: python3 -m unittest discover -s scripts -p test_prepare_native_apks.py -v
      - name: Application archive and offline environment contracts
        run: python3 -m unittest discover -s scripts -p test_build_application.py -v
      - name: Application pipeline failure and isolation contracts
        run: python3 -m unittest discover -s scripts -p test_application_pipeline.py -v
      - name: Pinned standalone build input safety checks
        run: python3 -m unittest discover -s scripts -p test_build_standalone.py -v
      - name: Single-file packager and tagged launcher safety checks
        run: python3 -m unittest discover -s scripts -p test_pack_standalone.py -v
      - name: Go contracts and race checks
        run: go test -race -count=1 ./...
      - name: Release-profile large color PDF regression
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 -timeout=2m -run '^TestIsolatedLargeColorScan$' ./internal/pdfassemble
      - name: Compiled identity and document recovery
        run: python3 scripts/check-state-recovery.py --receipt "$RUNNER_TEMP/state-recovery.json"
      - name: Build embedded frontend
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/build-web.py --output "$RUNNER_TEMP/scanner" --ref "$GITHUB_REF" --sha "$GITHUB_SHA"
          else
            python3 scripts/build-web.py --output "$RUNNER_TEMP/scanner"
          fi
      - name: Test embedded assets and executable
        run: |
          go test -tags webui ./internal/webui
          "$RUNNER_TEMP/scanner" version > "$RUNNER_TEMP/scanner-version.json"
          cat "$RUNNER_TEMP/scanner-version.json"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/check-release-ref.py --ref "$GITHUB_REF" --sha "$GITHUB_SHA" > "$RUNNER_TEMP/scanner-identity.json"
            python3 -c 'import json,os,pathlib; root=pathlib.Path(os.environ["RUNNER_TEMP"]); actual=json.loads((root/"scanner-version.json").read_text()); expected=json.loads((root/"scanner-identity.json").read_text()); assert actual["version"]==expected["version"] and actual["revision"]==expected["source_sha"], "built identity does not match event source"'
          fi
      - name: Audit frontend build dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Install pinned Go vulnerability checker
        env:
          GOBIN: ${{ runner.temp }}/security-tools
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable Go vulnerabilities with embedded frontend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: '"$RUNNER_TEMP/security-tools/govulncheck" -tags webui ./...'
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- go.mod go.sum web/package.json web/package-lock.json

  deployment-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install hash-locked deployment test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/deployment-tools"
          "$RUNNER_TEMP/deployment-tools/bin/python" -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-deployment.txt
      - name: Install verified Helm
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 --output "$RUNNER_TEMP/helm.tar.gz" https://get.helm.sh/helm-v3.21.1-linux-amd64.tar.gz
          echo "a349c62d6ab2d5d11f044fc0d3afa6deed7d27cc7d5c351f536b169d9fc2cc1a  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Kubernetes render and native runtime contracts
        run: '"$RUNNER_TEMP/deployment-tools/bin/python" scripts/test_helm_native.py -v'
      - name: Compose render and native runtime contracts
        run: python3 scripts/test_compose_native.py -v

  candidate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Build locked native payload from cold official inputs
        run: python3 scripts/build-native.py --output-dir "$RUNNER_TEMP/native" --retain-sources
      - name: Build frontend, API, onefile and distroless candidate
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            bash scripts/build-application.sh "$RUNNER_TEMP/native/native.tar" "$RUNNER_TEMP/candidate" "$GITHUB_REF" "$GITHUB_SHA"
          else
            bash scripts/build-application.sh "$RUNNER_TEMP/native/native.tar" "$RUNNER_TEMP/candidate"
          fi
      - name: Bind native and application source revisions
        run: |
          cp "$RUNNER_TEMP/native/result.json" "$RUNNER_TEMP/candidate/native-build.json"
          python3 -c 'import json,os,pathlib; root=pathlib.Path(os.environ["RUNNER_TEMP"]); native=json.loads((root/"candidate/native-build.json").read_text()); app=json.loads((root/"candidate/result.json").read_text()); assert native["passed"] and app["passed"] and native["source_revision"]==app["source_revision"]'
      - name: Retain the complete internal candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/candidate/packaged/
            ${{ runner.temp }}/candidate/native-sbom/
            ${{ runner.temp }}/candidate/onefile-sbom/
            ${{ runner.temp }}/candidate/image-sbom/
            ${{ runner.temp }}/candidate/base-sources.tar
            ${{ runner.temp }}/candidate/base-inventory.json
            ${{ runner.temp }}/candidate/image.tar
            ${{ runner.temp }}/candidate/image.json
            ${{ runner.temp }}/candidate/image-binary.json
            ${{ runner.temp }}/candidate/native-build.json
            ${{ runner.temp }}/candidate/application-sources.tar
            ${{ runner.temp }}/candidate/application.json
            ${{ runner.temp }}/candidate/app-buildinfo.json
            ${{ runner.temp }}/candidate/launcher-buildinfo.json
            ${{ runner.temp }}/candidate/result.json
            ${{ runner.temp }}/candidate/candidate-checksums.json
      - name: Retain native corresponding-source inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-sources-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native/external-sources.tar
            ${{ runner.temp }}/native/tesseract-source.tar.gz
            ${{ runner.temp }}/native/source.tar
            ${{ runner.temp }}/native/result.json
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native/*.stderr
            ${{ runner.temp }}/native/*.stdout
            ${{ runner.temp }}/native/result.json
            ${{ runner.temp }}/candidate/*.log
            ${{ runner.temp }}/candidate/result.json

  candidate-advisories:
    needs: candidate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download this run attempt's candidate inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "candidate-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/security-inputs"
      - name: Collect image, onefile and native advisory reports
        run: bash scripts/scan-candidate.sh "$RUNNER_TEMP/security-inputs" "$RUNNER_TEMP/security"
      - name: Retain raw findings and completion status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-advisories-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/security/

  candidate-materials:
    needs: [candidate-build, candidate-advisories]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download materials from this exact run attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "candidate-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/material-inputs/candidate"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "native-sources-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/material-inputs/native"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "candidate-advisories-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" --dir "$RUNNER_TEMP/material-inputs/security"
      - name: Bind and seal generated candidate materials offline
        run: bash scripts/prepare-candidate.sh "$RUNNER_TEMP/material-inputs" "$RUNNER_TEMP/materials"
      - name: Retain the sealed candidate handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staged-candidate-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/materials/
      - name: Retain stage failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: material-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/materials/*.log

  required-checks:
    if: always()
    needs: [release-ref-policy, test-and-build, deployment-contracts, candidate-build, candidate-advisories, candidate-materials]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require every applicable source check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_RESULT: ${{ needs.release-ref-policy.result }}
          TEST_RESULT: ${{ needs.test-and-build.result }}
          DEPLOY_RESULT: ${{ needs.deployment-contracts.result }}
          NATIVE_RESULT: ${{ needs.candidate-build.result }}
          SECURITY_RESULT: ${{ needs.candidate-advisories.result }}
          MATERIAL_RESULT: ${{ needs.candidate-materials.result }}
        run: sh scripts/check-required-jobs.sh

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || vars.SCANNER_PUBLISH_ENABLED == 'true')
    needs: required-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: scanner-kiosk-publisher
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the same-run development preview candidate
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/publication"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/publication/artifacts.json"
          artifact_name=$(python3 scripts/import-publication-plan.py \
            --preview-run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" \
            --metadata "$RUNNER_TEMP/publication/artifacts.json")
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir "$RUNNER_TEMP/publication"
      - name: Prepare the source-backed development image plan offline
        if: github.ref == 'refs/heads/main'
        run: |
          set -Eeuo pipefail
          umask 077
          tools="scanner-preview-plan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT:tools"
          container="scanner-preview-plan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            status=$?
            trap - EXIT
            docker rm --force "$container" >/dev/null 2>&1 || true
            if ! timeout 60 docker image rm "$tools"; then test "$status" -ne 0 || status=1; fi
            exit "$status"
          }
          trap cleanup EXIT
          timeout 300 docker build --platform linux/amd64 --network none --file native/Dockerfile.apk-fetch --tag "$tools" native
          timeout 180 docker run --rm --name "$container" --network none --read-only \
            --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges \
            --memory 1g --memory-swap 1g --cpus 2 --pids-limit 64 \
            --ulimit nofile=256:256 --ulimit fsize=16777216:16777216 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/publication/candidate,dst=/candidate,readonly" \
            --workdir /source --entrypoint /usr/bin/env "$tools" \
            -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp PYTHONDONTWRITEBYTECODE=1 \
            python3 /source/scripts/publication-policy.py --development-preview --candidate /candidate \
            --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" > "$RUNNER_TEMP/publication/preview-plan.json"
          chmod 444 "$RUNNER_TEMP/publication/preview-plan.json"
      - name: Push the repository-linked development preview image
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/publication/preview-plan.json"
          plan_sha256=$(sha256sum "$plan" | cut -d ' ' -f 1)
          python3 scripts/write-publication.py --candidate "$RUNNER_TEMP/publication/candidate" \
            --plan "$plan" --plan-sha256 "$plan_sha256" \
            --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --apply
      - name: Import the protected approved plan
        if: github.ref != 'refs/heads/main'
        id: approved-plan
        env:
          PLAN_JSON: ${{ vars.SCANNER_PUBLICATION_PLAN_JSON }}
          PLAN_SHA256: ${{ vars.SCANNER_PUBLICATION_PLAN_SHA256 }}
        run: |
          artifact_id=$(python3 scripts/import-publication-plan.py \
            --plan "$RUNNER_TEMP/publication/publication-plan.json" --sha "$GITHUB_SHA")
          printf 'artifact_id=%s\n' "$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Download the approved staged handoff from this push run
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.approved-plan.outputs.artifact_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/publication/artifact.json"
          artifact_name=$(python3 scripts/import-publication-plan.py \
            --plan "$RUNNER_TEMP/publication/publication-plan.json" \
            --metadata "$RUNNER_TEMP/publication/artifact.json" --run-id "$GITHUB_RUN_ID")
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir "$RUNNER_TEMP/publication"
      - name: Publish the approved sealed candidate
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCANNER_PUBLISH_ENABLED: ${{ vars.SCANNER_PUBLISH_ENABLED }}
          PLAN_SHA256: ${{ vars.SCANNER_PUBLICATION_PLAN_SHA256 }}
        run: |
          test -n "$PLAN_SHA256"
          python3 scripts/write-publication.py \
            --candidate "$RUNNER_TEMP/publication/candidate" \
            --plan "$RUNNER_TEMP/publication/publication-plan.json" \
            --plan-sha256 "$PLAN_SHA256" \
            --ref "$GITHUB_REF" --sha "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --apply
