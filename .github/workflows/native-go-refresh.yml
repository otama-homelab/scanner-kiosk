name: Measure patched Go native helper
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 537255dc21d4e2c0ea196b2cb3da125984414332
          fetch-depth: 0
          persist-credentials: false
      - name: Rebuild with locked official SDK and retain the measured helper
        run: |
          test "$(git rev-parse HEAD)" = 537255dc21d4e2c0ea196b2cb3da125984414332
          bash scripts/build-native.sh "$RUNNER_TEMP/native"
      - name: Retain measurement even when old runtime hash rejects the new helper
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go1274-helper-measurement-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native/helper.tar
            ${{ runner.temp }}/native/result.json
            ${{ runner.temp }}/native/*.stderr
            ${{ runner.temp }}/native/*.stdout
