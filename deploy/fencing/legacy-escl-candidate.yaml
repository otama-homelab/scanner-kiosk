# Review candidate only. Not referenced by Helm, Compose or homelab GitOps.
# Replace the documentation-only CIDR with the intended scanner address.
# Apply only during an accepted cutover: this intentionally disables legacy eSCL.
# This covers one managed Pod path, not host/LAN writers or physical stop proof.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: scanner-legacy-escl-fence
  namespace: scanservjs
spec:
  description: Cutover candidate blocking the registered legacy eSCL transport.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: scanservjs
      app.kubernetes.io/instance: scanservjs
  enableDefaultDeny:
    ingress: false
    egress: false
  egressDeny:
    - toCIDR:
        - 192.0.2.115/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
