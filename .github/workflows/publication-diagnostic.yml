name: Read-only publication diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 94c92015640163a7366379bd0db2e8f84ad45708
          persist-credentials: false
      - name: Download exact failed publication images
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43252385187 --repo otama-homelab/scanner-kiosk --name candidate-94c92015640163a7366379bd0db2e8f84ad45708-1 --dir "$RUNNER_TEMP/candidate"
      - name: Inspect images and registry without writes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate'
          with tempfile.TemporaryDirectory() as config:
            env = {**os.environ, 'DOCKER_CONFIG': config}
            def check(label, args, data=None):
              p = subprocess.run(args, input=data, capture_output=True, env=env, timeout=120)
              clean = lambda b: b.decode(errors='replace').replace(os.environ['GH_TOKEN'], '[redacted]')[:8192]
              print(json.dumps({'step': label, 'returncode': p.returncode, 'stdout': clean(p.stdout), 'stderr': clean(p.stderr)}), flush=True)
              return p
            check('docker-version', ['docker', 'version'])
            check('registry-login', ['docker', 'login', 'ghcr.io', '--username', os.environ['GITHUB_ACTOR'], '--password-stdin'], os.environ['GH_TOKEN'].encode())
            for role, file, image_id, repository in [
                ('core', 'scanner-image.tar', 'sha256:72b238abf9c4d92db34fd7eb8f4a4b8eb72368ba0311b440e5b39b9efc04e67a', 'scanner-kiosk'),
                ('tesseract', 'scanner-tesseract-image.tar', 'sha256:df94f392c1e2e08dfff082a23ee5b16bf4c7d5f4afbb44a02805d1ed7c878b5c', 'scanner-kiosk-tesseract')]:
              check(role+'-load', ['docker', 'load', '--input', str(root/file)])
              check(role+'-identity', ['docker', 'image', 'inspect', '--format', '{{.Id}}', image_id])
              check(role+'-registry', ['docker', 'manifest', 'inspect', '--verbose', 'ghcr.io/otama-homelab/'+repository+':v0.2.24'])
