allprojects { p ->
    if (p.path == ':evaluation') {
        p.plugins.withId('java') {
            p.tasks.register('runOfficialQuadEvaluation', JavaExec) {
                classpath = p.sourceSets.main.runtimeClasspath
                mainClass = 'org.fairscan.evaluation.QuadDetectionEvaluatorKt'
                workingDir = p.rootProject.projectDir
                maxHeapSize = '768m'
                jvmArgs '-XX:ActiveProcessorCount=2'
            }
        }
    }
}
